# Render Blueprint: one free web service that serves the React client,
# the REST API and the WebSocket gateway from the same URL.
services:
  - type: web
    name: pulsechat
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # paste your Neon connection string when Render asks
